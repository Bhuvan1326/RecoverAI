name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check backend ml rag scripts

      - name: Migration test (upgrade head on empty DB)
        run: |
          export PYTHONPATH=backend:.
          cd backend && python -m alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: "sqlite:////tmp/ci_migration_check.db"

      - name: ML smoke test (tiny synthetic dataset, not full training)
        run: |
          export PYTHONPATH=backend:.
          export DATABASE_URL="sqlite:////tmp/ci_ml_smoke.db"
          python scripts/generate_data.py --claims 300 --payers 5 --providers 10 --seed 1
          python -m ml.training.train_denial_model
          python -m ml.training.train_anomaly_model
          # denial_reason/appeal_success need more resolved cases than a 300-claim
          # sample reliably produces; they're covered by backend/tests instead
          # (which construct exact fixtures), keeping CI fast and deterministic.

      - name: Run backend + ML tests
        run: |
          export PYTHONPATH=backend:.
          pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t recoverai-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t recoverai-frontend:ci .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt || true # non-blocking for portfolio CI; review findings manually

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true
